case_studies:
  include: ../case_studies.yaml

data:
  indata_folder: /home/vaillant/codes/projects/2D-McDA/data/output
  version_2d_mcda: V2.2.0
  type_2d_mcda: Dev
  input_file_format: netCDF

plot:
  edges_removal: 0
  max_detect_level: 5
  invert_xaxis: false
  ymin: -0.5
  ymax: 20
  browse_image_aspect_ratio: true
  figures_path: out/figures
  # Steps to plot: all, none, or a list such as [12, 17]. Selecting a few steps
  # avoids reading the complete development arrays, which weigh a few hundred
  # megabytes each. The two-way transmittances are plotted only with all.
  steps: none
  # Channels of the step figures: all, or a list among 532_par, 532_per, 1064.
  channels: all
  # Channel and composite mask figures.
  final: true
